<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARC</title>
<meta name="description" content="ARC, penyihir kristal penjaga tautan Anda. Putar kartu tarot lalu buka tautan yang Anda butuhkan.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARC">

<script>
/* Terapkan tema sebelum halaman dicat supaya tidak berkedip */
(function () {
    var t = 'light';
    try { if (localStorage.getItem('theme') === 'dark') t = 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#06030e' : '#ffffff');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Caveat:wght@600;700&family=Satisfy&family=Lora:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
/* ============ Token tema ============ */
:root {
    --font-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
    --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --cw: 148px;
    --ch: 252px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
}
html[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #0f172a;
    --muted: rgba(15, 23, 42, .62);
    --focus: #7c3aed;
    --clay-bg: #ffffff;
    --clay-shadow: 30px 30px 60px #e2e8f0, -30px -30px 60px #ffffff;
    --card-bg: rgba(255, 255, 255, .4);
    --card-border: rgba(203, 213, 225, .6);
    --card-shadow: 0 10px 30px rgba(15, 23, 42, .05), inset 0 0 15px rgba(255, 255, 255, .8);
    --card-on-bg: rgba(255, 255, 255, .72);
    --card-on-border: #7c3aed;
    --card-on-shadow: 0 15px 40px rgba(124, 58, 237, .18), inset 0 0 20px rgba(255, 255, 255, .9);
    --card-title: #0f172a;
    --card-desc: #4338ca;
    --art-bg: rgba(241, 245, 249, .5);
    --art-border: rgba(124, 58, 237, .15);
    --art-icon: #6d28d9;
    --frame: rgba(124, 58, 237, .2);
    --btn-bg: rgba(255, 255, 255, .85);
    --btn-ink: #4338ca;
    --btn-border: rgba(226, 232, 240, .9);
    --btn-shadow: 0 4px 12px rgba(0, 0, 0, .06);
    --panel: rgba(255, 255, 255, .96);
    --panel-line: rgba(148, 163, 184, .35);
    --field-bg: rgba(238, 242, 255, .6);
    --field-border: #c7d2fe;
    --item-bg: rgba(99, 102, 241, .1);
    --item-ink: #4f46e5;
    --dot: rgba(79, 70, 229, .25);
    --dot-on: #7c3aed;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
}
html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #06030e;
    --ink: #f8fafc;
    --muted: rgba(248, 250, 252, .62);
    --focus: #facc15;
    --clay-bg: #0b0618;
    --clay-shadow: 25px 25px 55px #020107, -25px -25px 55px #140b29;
    --card-bg: rgba(18, 10, 36, .15);
    --card-border: rgba(234, 179, 8, .2);
    --card-shadow: 0 10px 30px rgba(0, 0, 0, .5), inset 0 0 15px rgba(234, 179, 8, .1);
    --card-on-bg: rgba(26, 14, 50, .3);
    --card-on-border: #facc15;
    --card-on-shadow: 0 0 30px rgba(250, 204, 21, .25), inset 0 0 20px rgba(234, 179, 8, .15);
    --card-title: #fef08a;
    --card-desc: #e2e8f0;
    --art-bg: rgba(147, 51, 234, .06);
    --art-border: rgba(234, 179, 8, .15);
    --art-icon: #facc15;
    --frame: rgba(234, 179, 8, .2);
    --btn-bg: rgba(20, 12, 38, .6);
    --btn-ink: #facc15;
    --btn-border: rgba(234, 179, 8, .28);
    --btn-shadow: 0 4px 14px rgba(0, 0, 0, .4);
    --panel: rgba(18, 10, 36, .94);
    --panel-line: rgba(234, 179, 8, .2);
    --field-bg: rgba(46, 16, 101, .35);
    --field-border: rgba(234, 179, 8, .3);
    --item-bg: rgba(250, 204, 21, .1);
    --item-ink: #facc15;
    --dot: rgba(250, 204, 21, .25);
    --dot-on: #facc15;
    --primary: #6d28d9;
    --primary-hover: #7c3aed;
}

/* ============ Dasar ============ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--bg); scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
html.no-scroll, html.no-scroll body { overflow: hidden; }
body {
    font-family: var(--font-display);
    background: transparent;                /* latar = gambar G.jpeg (.bg-art); warna --bg tetap di <html> sebagai cadangan */
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
    overscroll-behavior: none;
    transition: background-color .6s ease, color .6s ease;
}
body.is-dragging { cursor: grabbing; }
/* gambar latar: nebula G.jpeg, tetap di tempat saat halaman bergulir */
.bg-art {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--bg) url('G.jpeg') center 45% / cover no-repeat;
}
.bg-art::after { content: ''; position: absolute; inset: 0; background: var(--bg-veil); transition: background .6s ease; }
html[data-theme="light"] { --bg-veil: linear-gradient(rgba(250, 247, 255, .6), rgba(240, 232, 255, .52)); }   /* tema terang: dipudarkan agar tulisan gelap tetap terbaca */
/* tema gelap: area di belakang penyihir digelapkan; video penyihir memakai blend "screen" sehingga di atas nebula terang ia tampak pudar */
html[data-theme="dark"] { --bg-veil:
    radial-gradient(ellipse 50vh 78vh at 50% 56%, rgba(4, 2, 10, .92) 0%, rgba(4, 2, 10, .8) 45%, rgba(4, 2, 10, 0) 100%),
    linear-gradient(rgba(6, 3, 14, .45), rgba(6, 3, 14, .6)); }
input { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* ============ Latar ============ */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.clay { position: absolute; border-radius: 50%; background: var(--clay-bg); box-shadow: var(--clay-shadow); opacity: .3; transition: background .6s, box-shadow .6s; }
.clay-1 { width: min(480px, 62vmin); aspect-ratio: 1; top: -8vmin; left: -8vmin; }
.clay-2 { width: min(520px, 66vmin); aspect-ratio: 1; bottom: -12vmin; right: -9vmin; }
.moon {
    position: absolute; left: 50%; top: 50%;
    width: min(760px, 120vmin); height: min(760px, 120vmin);
    margin: calc(min(760px, 120vmin) / -2) 0 0 calc(min(760px, 120vmin) / -2);
    opacity: .45;
    filter: drop-shadow(0 0 15px rgba(234, 179, 8, .4));
    animation: moonRock 15s ease-in-out infinite;
}
@keyframes moonRock { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(4deg) scale(1.02); } }

.aura {
    position: fixed; left: 50%; top: 50%;
    width: min(660px, 96vmin); aspect-ratio: 1;
    translate: -50% -50%;
    z-index: 2; pointer-events: none;
}
.aura::before, .aura::after { content: ''; position: absolute; border-radius: 50%; }
.aura::before { inset: 0; border: 2px dashed rgba(234, 179, 8, .32); animation: spinCW 25s linear infinite; }
.aura::after  { inset: -6%; border: 2px dotted rgba(250, 204, 21, .24); animation: spinCCW 35s linear infinite; }
/* Aura "bernapas" selama musik diputar (kelas music-on diatur oleh JS; mati otomatis di mode kurangi gerak) */
.aura, .moon { --beat-c: rgba(250, 204, 21, .6); }
html[data-theme="light"] .aura, html[data-theme="light"] .moon { --beat-c: rgba(202, 138, 4, .45); }
body.music-on .aura { animation: auraBeat 2.6s ease-in-out infinite; }
body.music-on .moon { animation: moonRock 15s ease-in-out infinite, moonGlow 2.6s ease-in-out infinite; }
@keyframes auraBeat {
    0%, 100% { scale: 1; filter: drop-shadow(0 0 0 transparent); }
    50% { scale: 1.022; filter: drop-shadow(0 0 12px var(--beat-c)); }
}
@keyframes moonGlow {
    0%, 100% { opacity: .45; filter: drop-shadow(0 0 15px rgba(234, 179, 8, .4)); }
    50% { opacity: .68; filter: drop-shadow(0 0 30px var(--beat-c)); }
}
@keyframes spinCW  { to { transform: rotate(360deg); } }
@keyframes spinCCW { to { transform: rotate(-360deg); } }

/* ============ Penyihir ============ */
.witch, .witch-zone {
    --wh: min(122vh, calc(128vw * 16 / 9), 1340px);
    position: fixed; left: 50%; top: 50%;
    height: var(--wh); width: calc(var(--wh) * 9 / 16);
    translate: -50% calc(-50% + 9vh);
    z-index: 3; pointer-events: none;
    animation: breathe 6s ease-in-out infinite;
}
@supports (height: 100dvh) {
    .witch, .witch-zone { --wh: min(122dvh, calc(128vw * 16 / 9), 1340px); }
}
@keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.03; } }

/* Denyut cahaya saat penyihir disentuh */
.pulse {
    position: fixed; left: 50%; top: 50%; width: min(620px, 100vmin); aspect-ratio: 1;
    translate: -50% calc(-50% - 4vh); z-index: 4; pointer-events: none; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, var(--pulse-c) 0%, transparent 62%);
}
html[data-theme="light"] .pulse { --pulse-c: rgba(124, 58, 237, .38); }
html[data-theme="dark"]  .pulse { --pulse-c: rgba(250, 204, 21, .45); }
.pulse.go { animation: pulse .9s ease-out; }
@keyframes pulse { from { opacity: .95; transform: scale(.35); } to { opacity: 0; transform: scale(1.25); } }

/* Area sentuh penyihir: kotak yang sama dengan video, berada di bawah kartu (z-index 10) */
.witch-zone { z-index: 5; }
.witch-hit {
    position: absolute; left: 16%; right: 16%; top: 6%; bottom: 22%;
    pointer-events: auto; cursor: pointer; border-radius: 42% 42% 26% 26% / 30% 30% 16% 16%;
    -webkit-tap-highlight-color: transparent;
}
.witch-hit:focus-visible { outline-offset: -4px; }
.witch video {
    display: block; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .6s ease;
}
.witch video.ready { opacity: 1; }
/* Blend dipasang di kontainer (bukan di video) agar benar-benar berbaur dengan latar halaman */
html[data-theme="light"] .witch { mix-blend-mode: multiply; }
/* 7.mp4 punya bar hitam setinggi 100px (7,8%) di atas dan bawah: dipotong di sini */
/* brightness memutihkan pola kotak-kotak samar di latar video agar hilang saat di-multiply */
html[data-theme="light"] .witch video { clip-path: inset(8.2% 0); filter: brightness(1.04) contrast(1.05); }
html[data-theme="dark"] .witch { mix-blend-mode: screen; }
html[data-theme="dark"] .witch video {
    -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
}

/* ============ Merek, pager ============ */
.brand {
    position: fixed; z-index: 30; left: 50%; top: calc(16px + var(--safe-t));
    translate: -50% 0; text-align: center; pointer-events: none;
}
.brand h1 { font-size: 1.35rem; font-weight: 900; letter-spacing: .34em; padding-left: .34em; color: var(--card-title); }
.brand p { font-family: var(--font-ui); font-size: .72rem; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }

.action-btn {
    width: 44px; height: 44px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.05rem; color: var(--btn-ink);
    background: var(--btn-bg); border: 1px solid var(--btn-border); box-shadow: var(--btn-shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .25s, background .4s, color .4s, border-color .4s;
}
.action-btn:hover { transform: translateY(-2px) scale(1.06); }
.action-btn:active { transform: scale(.96); }
.action-btn.small { width: 34px; height: 34px; font-size: .85rem; }
.action-btn[hidden] { display: none; }

.pager {
    position: fixed; z-index: 30; left: 50%; translate: -50% 0;
    bottom: calc(18px + var(--safe-b));
    display: flex; align-items: center; gap: 14px;
    width: max-content; max-width: calc(100vw - 24px);
}
.dots { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 140px); }
/* lebar titik menyusut mengikuti jumlah kartu supaya tetap satu baris dan tidak menabrak kotak tanya */
.dot { width: clamp(9px, calc((min(100vw - 140px, 560px) - 26px) / var(--n, 10) - 4px), 22px); height: 22px; display: grid; place-items: center; }
.dot::before {
    content: ''; width: 8px; height: 8px; border-radius: 99px; background: var(--dot);
    transition: width .3s, background .3s;
}
.dot[aria-current="true"]::before { width: 22px; background: var(--dot-on); }
.hint {
    position: fixed; z-index: 30; left: 50%; translate: -50% 0;
    bottom: calc(58px + var(--safe-b));
    width: max-content; max-width: calc(100vw - 32px);
    font-family: var(--font-ui); font-size: .78rem; font-weight: 600; text-align: center;
    color: var(--btn-ink); pointer-events: none; transition: opacity .8s;
    padding: 7px 16px; border-radius: 99px; line-height: 1.35;
    background: var(--btn-bg); border: 1px solid var(--btn-border); box-shadow: var(--btn-shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.hint.hide { opacity: 0; }
/* Layar pendek: petunjuk pindah ke bawah judul supaya tidak menimpa kartu */
@media (max-height: 720px) { .hint { bottom: auto; top: calc(66px + var(--safe-t)); } }
/* Panel Playlist terbuka di layar lebar: petunjuk pindah ke tengah ruang kosong di kanan panel, supaya tidak tertimpa */
@media (min-width: 641px) {
    html:has(#ytPanel:not([hidden]):not(.closed)) .hint {
        --pr: calc(12px + var(--safe-l) + min(320px, calc(100vw - 24px)));
        left: calc(var(--pr) + (100vw - var(--pr)) / 2);
        max-width: calc(100vw - var(--pr) - 32px);
    }
}
@media (min-width: 641px) and (max-width: 1000px) {
    html:has(#ytPanel:not([hidden]):not(.closed)) .hint { --pr: calc(12px + var(--safe-l) + min(280px, calc(100vw - 24px))); }
}

/* ============ Karusel 3D ============ */
.scene {
    position: absolute; inset: 0; margin: auto;
    width: var(--cw); height: var(--ch);
    perspective: 1500px;
    z-index: 10;
    /* turun maksimal 24% tinggi layar, tetapi tidak sampai menimpa kotak tanya di bawah */
    translate: 0 min(24vh, calc(50vh - 100px - var(--ch) * .64 - var(--safe-b)));
    opacity: 0; transition: opacity .9s ease .2s;
}
.scene.ready { opacity: 1; }
@supports (height: 100dvh) { .scene { translate: 0 min(24dvh, calc(50dvh - 100px - var(--ch) * .64 - var(--safe-b))); } }
.carousel { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.tarot-card { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card-face {
    position: relative; width: 100%; height: 100%;
    border-radius: 16px; padding: 9px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    text-align: center;
    background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
    transition: transform .4s cubic-bezier(.16, 1, .3, 1), background .4s, border-color .4s, box-shadow .4s;
}
.tarot-card.active .card-face {
    transform: scale(1.05);
    background: var(--card-on-bg); border-color: var(--card-on-border); box-shadow: var(--card-on-shadow);
}
.card-frame { position: absolute; inset: 6px; border-radius: 12px; border: 1.5px solid var(--frame); pointer-events: none; }
.card-corner {
    width: 100%; padding: 4px 8px 0;
    display: flex; justify-content: space-between;
    font-size: .6rem; color: var(--card-title); opacity: .75;
}
.card-art {
    position: relative; overflow: hidden; width: 100%; flex: 1; min-height: 0; margin: 6px 0;
    border-radius: 9px; display: grid; place-items: center;
    background: var(--art-bg); border: 1px solid var(--art-border);
}
.card-art i { font-size: 2.3rem; color: var(--art-icon); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .25)); }
.card-text { width: 100%; padding: 0 4px; }
.card-title {
    font-size: .82rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--card-title);
    overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-desc {
    font-family: var(--font-ui); font-size: .68rem; font-weight: 600; line-height: 1.3; margin-top: 2px; color: var(--card-desc);
    overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-hit { position: absolute; inset: 0; z-index: 1; border-radius: 16px; background: transparent; }
.card-admin { position: absolute; z-index: 2; top: 34px; right: 14px; display: flex; gap: 6px; }
.mini {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: .7rem; color: #fff; border: 1px solid rgba(255, 255, 255, .6);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .2); transition: transform .2s;
}
.mini:hover { transform: scale(1.12); }
.mini.edit { background: rgba(79, 70, 229, .92); }
.mini.del  { background: rgba(225, 29, 72, .92); }

/* ============ Menu penyihir (kaca / glassmorphism, di sisi kanan) ============ */
html[data-theme="light"] .witch-menu, html[data-theme="light"] .witch-dialog, html[data-theme="light"] .yt-panel {
    --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, .62), rgba(224, 231, 255, .26));
    --glass-line: rgba(124, 58, 237, .22);
    --glass-edge: rgba(255, 255, 255, .85);
    --glass-shadow: 0 12px 36px rgba(79, 70, 229, .2);
    --glass-opt: rgba(255, 255, 255, .42);
    --glass-opt-line: rgba(124, 58, 237, .16);
}
html[data-theme="dark"] .witch-menu, html[data-theme="dark"] .witch-dialog, html[data-theme="dark"] .yt-panel {
    --glass-bg: linear-gradient(145deg, rgba(60, 34, 110, .34), rgba(14, 8, 30, .3));
    --glass-line: rgba(250, 204, 21, .3);
    --glass-edge: rgba(255, 255, 255, .16);
    --glass-shadow: 0 12px 40px rgba(0, 0, 0, .55);
    --glass-opt: rgba(255, 255, 255, .06);
    --glass-opt-line: rgba(250, 204, 21, .18);
}
.menu-backdrop { position: fixed; inset: 0; z-index: 40; visibility: hidden; }
.menu-backdrop.show { visibility: visible; }
.witch-menu {
    position: fixed; z-index: 41; top: 50%; right: calc(14px + var(--safe-r));
    translate: 0 -50%;
    width: min(196px, 50vw);
    padding: 16px 12px 12px; border-radius: 22px;
    background: var(--glass-bg); color: var(--ink);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
    font-family: var(--font-ui);
    opacity: 0; visibility: hidden; transform: translateX(16px) scale(.94); transform-origin: 100% 50%;
    transition: opacity .25s, transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s .35s;
}
.witch-menu.show { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s; }
/* ekor balon ucapan mengarah ke penyihir (kiri) */
.witch-menu::after {
    content: ''; position: absolute; left: -8px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
    background: var(--glass-bg); border-left: 1px solid var(--glass-line); border-bottom: 1px solid var(--glass-line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transform: rotate(45deg);
}
.witch-say {
    min-height: 2.5em; margin: 0 4px 12px; text-align: left;
    font-family: var(--font-display); font-size: .95rem; font-weight: 700; line-height: 1.25; letter-spacing: .06em; color: var(--card-title);
}
.witch-say.typing::after { content: '▍'; margin-left: 2px; opacity: .7; animation: caret .7s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.witch-options { display: flex; flex-direction: column; gap: 8px; }
.opt {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 14px; text-align: left;
    font: 700 .78rem/1.25 var(--font-ui); color: var(--item-ink);
    background: var(--glass-opt); border: 1px solid var(--glass-opt-line);
    transition: transform .2s, border-color .2s, background .3s;
}
.opt[hidden] { display: none; }
.opt i { width: 1.2em; flex: none; text-align: center; font-size: 1.05rem; }
.opt:hover { transform: translateX(-3px); border-color: var(--card-on-border); }
.opt:active { transform: scale(.97); }
.witch-menu.show .opt { animation: optIn .35s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(.6s + var(--i) * .08s); }
@keyframes optIn { from { opacity: 0; transform: translateX(12px); } }
.opt.vol { cursor: default; }
.opt.vol:hover { transform: none; }
.vol-range { flex: 1; min-width: 0; height: 22px; accent-color: var(--item-ink); cursor: pointer; background: transparent; }

/* ============ Dialog sapaan penyihir (kiri, dekat penyihir) ============ */
.witch-dialog {
    --wh: min(122vh, calc(128vw * 16 / 9), 1340px);
    --dw: min(150px, 40vw);
    position: fixed; z-index: 12; pointer-events: none; width: var(--dw);
    left: max(calc(12px + var(--safe-l)), calc(50% - var(--wh) * 9 / 16 * .2 - var(--dw)));
    top: clamp(calc(78px + var(--safe-t)), calc(50% + 9vh - var(--wh) * .28), 40%);
    padding: 7px 12px 8px; border-radius: 14px 14px 5px 14px;
    background: var(--glass-bg); border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
    opacity: 0; transform: translateY(10px) scale(.92); transform-origin: 100% 70%;
    transition: opacity .45s ease, transform .5s cubic-bezier(.16, 1, .3, 1);
}
@supports (height: 100dvh) { .witch-dialog { --wh: min(122dvh, calc(128vw * 16 / 9), 1340px); } }
.witch-dialog.show { opacity: 1; transform: none; }
/* ekor balon mengarah ke penyihir (kanan) */
.witch-dialog::after {
    content: ''; position: absolute; right: -6px; top: 62%; width: 10px; height: 10px; margin-top: -5px;
    background: var(--glass-bg); border-right: 1px solid var(--glass-line); border-top: 1px solid var(--glass-line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transform: rotate(45deg);
}
.wd-text {
    position: relative; overflow-wrap: anywhere;
    font-family: var(--wd-font); font-size: calc(var(--wd-size) * .88); font-weight: var(--wd-weight); line-height: var(--wd-lh); letter-spacing: var(--wd-ls);
    color: var(--card-title);
}
.wd-ghost { visibility: hidden; }                       /* menahan tinggi kotak agar tidak melompat saat mengetik */
.wd-live { position: absolute; left: 0; top: 0; right: 0; }
.wd-live.typing::after { content: '▍'; margin-left: 1px; opacity: .7; animation: caret .7s steps(1) infinite; }

/* ============ Drawer, modal, toast ============ */
.overlay {
    position: fixed; inset: 0; z-index: 800; background: rgba(15, 23, 42, .55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s;
}
.overlay.show { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
#modalOverlay { z-index: 900; display: flex; align-items: center; justify-content: center; padding: 16px; }

.side-drawer {
    position: fixed; z-index: 850; top: 0; left: 0; height: 100vh; height: 100dvh;
    width: min(300px, 86vw);
    padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b)) calc(20px + var(--safe-l));
    background: var(--panel); color: var(--ink);
    border-right: 1px solid var(--panel-line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    font-family: var(--font-ui);
    transform: translateX(-105%); visibility: hidden;
    transition: transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s .35s;
    display: flex; flex-direction: column;
}
.side-drawer.show { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--panel-line); }
.drawer-head h2 { font-family: var(--font-display); font-size: 1rem; font-weight: 700; letter-spacing: .08em; }
.drawer-head p { font-size: .72rem; font-weight: 600; color: var(--muted); margin-top: 2px; }
.drawer-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding-right: 2px; }
.drawer-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
    border-radius: 16px; text-align: left; transition: transform .2s, background .2s;
}
.drawer-item:hover { transform: translateX(4px); background: var(--item-bg); }
.drawer-item.current { background: var(--item-bg); }
.drawer-icon { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.05rem; background: var(--item-bg); color: var(--item-ink); }
.drawer-item .txt { flex: 1; min-width: 0; }
.drawer-item .t { font-size: .85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-item .d { font-size: .72rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-item .chev { font-size: .7rem; opacity: .4; }

.modal-card {
    width: 100%; max-width: 420px; border-radius: 24px; padding: 24px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--panel-line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    font-family: var(--font-ui);
    box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
    transform: scale(.92); transition: transform .3s cubic-bezier(.16, 1, .3, 1);
}
#modalOverlay.show .modal-card { transform: none; }
.modal-card h3 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
.modal-body { font-size: .88rem; margin: 12px 0; line-height: 1.5; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: .75rem; font-weight: 700; margin-bottom: 4px; opacity: .85; }
.field input {
    width: 100%; padding: 10px 12px; border-radius: 12px; font: 600 .9rem var(--font-ui);
    color: var(--ink); background: var(--field-bg); border: 1px solid var(--field-border);
}
.field input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.btn { padding: 9px 16px; border-radius: 12px; font: 700 .8rem var(--font-ui); transition: background .2s, transform .15s; }
.btn:active { transform: scale(.97); }
.btn-ghost { background: rgba(148, 163, 184, .22); color: var(--ink); }
.btn-ghost:hover { background: rgba(148, 163, 184, .38); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { background: #e11d48; color: #fff; }
.btn-danger:hover { background: #be123c; }

#toastBox {
    position: fixed; z-index: 999; bottom: calc(122px + var(--safe-b)); left: 50%; translate: -50% 0;
    width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.toast {
    display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px;
    font: 600 .85rem var(--font-ui); color: #fff; box-shadow: 0 10px 25px rgba(0, 0, 0, .18);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    animation: toastIn .3s cubic-bezier(.16, 1, .3, 1) both; transition: opacity .3s, transform .3s;
}
.toast.out { opacity: 0; transform: translateX(30%); }
.toast i { font-size: 1.05rem; }
.toast.success { background: rgba(16, 185, 129, .94); border: 1px solid rgba(52, 211, 153, .6); }
.toast.error   { background: rgba(225, 29, 72, .94);  border: 1px solid rgba(251, 113, 133, .6); }
.toast.info    { background: rgba(99, 102, 241, .94); border: 1px solid rgba(165, 180, 252, .6); }
@keyframes toastIn { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ============ Pemutar YouTube (kiri) ============ */
.yt-panel {
    position: fixed; z-index: 32; left: calc(12px + var(--safe-l)); bottom: calc(18px + var(--safe-b));
    width: min(320px, calc(100vw - 24px));
    padding: 12px; border-radius: 22px;
    background: var(--glass-bg); color: var(--ink);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
    font-family: var(--font-ui);
    transition: transform .4s cubic-bezier(.16, 1, .3, 1), opacity .3s;
}
.yt-panel.closed { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
.yt-panel[hidden], .yt-panel [hidden], .yt-fab[hidden], .yt-dock[hidden], .yt-dock [hidden] { display: none !important; }
.yt-dock {
    position: fixed; z-index: 32; left: calc(12px + var(--safe-l)); bottom: calc(18px + var(--safe-b));
    display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 24px);
}
.yt-fab { flex: none; }
/* Judul lagu yang sedang diputar, tetap tampil saat panel disembunyikan */
.yt-mini {
    display: inline-flex; align-items: center; gap: 9px; min-width: 0; max-width: min(280px, calc(100vw - 100px));
    height: 40px; padding: 0 16px 0 14px; border-radius: 99px;
    font: 700 .78rem var(--font-ui); color: var(--btn-ink);
    background: var(--btn-bg); border: 1px solid var(--btn-border); box-shadow: var(--btn-shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .3s, transform .25s;
}
.yt-mini:hover { transform: translateY(-2px); }
.yt-mini.paused { opacity: .72; }
.yt-mini .yt-title-mini { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Judul panjang bergeser pelan bolak-balik agar terbaca penuh */
.yt-title-mini.marq { text-overflow: clip; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); }
.yt-title-mini.marq #ytMiniText { display: inline-block; animation: ytMarq var(--dur, 8s) ease-in-out infinite alternate; }
.yt-mini.paused .yt-title-mini.marq #ytMiniText { animation-play-state: paused; }
@keyframes ytMarq { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(calc(-1 * var(--shift, 0px))); } }
.yt-eq { flex: none; display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.yt-eq i { width: 3px; height: 35%; border-radius: 2px; background: currentColor; }
.yt-mini:not(.paused) .yt-eq i { animation: ytEq .9s ease-in-out infinite; }
.yt-mini:not(.paused) .yt-eq i:nth-child(2) { animation-delay: .25s; }
.yt-mini:not(.paused) .yt-eq i:nth-child(3) { animation-delay: .5s; }
@keyframes ytEq { 50% { height: 100%; } }
.yt-fab.playing i { animation: ytBeat 1.2s ease-in-out infinite; }
@keyframes ytBeat { 50% { transform: scale(1.25); } }
.yt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.yt-logo { color: #ef4444; font-size: 1.15rem; }
.yt-title { flex: 1; font-family: var(--font-display); font-size: .85rem; font-weight: 700; letter-spacing: .1em; color: var(--card-title); }
.yt-frame { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
#ytPlayer { display: block; width: 100%; height: 100%; border: 0; }
.yt-now { margin: 10px 2px 2px; font-size: .8rem; font-weight: 700; color: var(--card-desc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.yt-prog { display: flex; align-items: center; gap: 8px; margin: 4px 2px 0; }
.yt-prog output { flex: none; min-width: 2.7em; font-size: .68rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--card-desc); }
.yt-prog output:last-child { text-align: right; }
.yt-seek { --p: 0%; -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 20px; background: transparent; cursor: pointer; }
.yt-seek::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(90deg, var(--item-ink) var(--p), rgba(127, 127, 127, .35) var(--p)); }
.yt-seek::-moz-range-track { height: 4px; border-radius: 99px; background: rgba(127, 127, 127, .35); }
.yt-seek::-moz-range-progress { height: 4px; border-radius: 99px; background: var(--item-ink); }
.yt-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border: 0; border-radius: 50%; background: var(--item-ink); transition: transform .15s; }
.yt-seek::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--item-ink); }
.yt-seek:hover::-webkit-slider-thumb, .yt-seek:active::-webkit-slider-thumb { transform: scale(1.35); }
.yt-seek:disabled { cursor: default; opacity: .45; }
.yt-empty { margin: 8px 2px; font-size: .76rem; font-weight: 600; color: var(--muted); }
.yt-ctrl { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 4px; }
.yt-toggle { position: relative; opacity: .55; }
.yt-toggle.on { opacity: 1; background: var(--item-bg); border-color: var(--card-on-border); }
.yt-toggle[data-mode="one"]::after { content: '1'; position: absolute; right: 7px; bottom: 5px; font: 800 .5rem var(--font-ui); line-height: 1; }
.yt-list { position: relative; list-style: none; margin-top: 6px; max-height: clamp(96px, 26vh, 220px); overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; scrollbar-width: none; }
.yt-list::-webkit-scrollbar { display: none; }
/* Bayangan pudar di tepi atas/bawah: tanda masih ada lagu yang bisa digulir */
.yt-list.fade-b { -webkit-mask-image: linear-gradient(#000 calc(100% - 32px), transparent); mask-image: linear-gradient(#000 calc(100% - 32px), transparent); }
.yt-list.fade-t { -webkit-mask-image: linear-gradient(transparent, #000 32px); mask-image: linear-gradient(transparent, #000 32px); }
.yt-list.fade-t.fade-b { -webkit-mask-image: linear-gradient(transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(transparent, #000 32px, #000 calc(100% - 32px), transparent); }
.yt-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 10px; text-align: left;
    font-size: .78rem; font-weight: 700; color: var(--ink); transition: background .2s;
}
.yt-item:hover { background: var(--item-bg); }
.yt-item.current { background: var(--item-bg); color: var(--item-ink); }
.yt-item .n { flex: none; width: 1.4em; text-align: center; opacity: .6; }
.yt-item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1000px) { .yt-panel { width: min(280px, calc(100vw - 24px)); } }
@media (max-height: 560px) { .yt-list { display: none; } }

/* ----- HP: panel naik dari bawah seperti lembar, ketuk area gelap untuk menutup ----- */
.yt-backdrop { position: fixed; inset: 0; z-index: 31; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .35s; }
@media (max-width: 640px) {
    .yt-backdrop.show { opacity: 1; pointer-events: auto; }
    .yt-panel { left: 50%; right: auto; width: min(360px, calc(100vw - 24px)); translate: -50% 0; }
    .yt-panel.closed { transform: translateY(calc(100% + 40px)); }
    .yt-list { max-height: clamp(72px, 15vh, 132px); }
}
/* Layar sentuh: target sentuh lebih besar */
@media (pointer: coarse) {
    .yt-panel .action-btn.small { width: 40px; height: 40px; }
    .yt-seek { height: 30px; }
    .yt-seek::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -7px; }
    .yt-seek::-moz-range-thumb { width: 18px; height: 18px; }
    .yt-item { padding: 9px 8px; }
}

/* Menu admin musik (di dalam modal) */
.ytm-vol { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 12px; border-radius: 14px; background: var(--item-bg); color: var(--item-ink); }
.ytm-vol output { min-width: 2.4em; text-align: right; font-weight: 700; font-size: .8rem; }
.ytm-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: min(40vh, 280px); overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; }
.ytm-row { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; background: var(--item-bg); }
.ytm-row img { flex: none; width: 48px; height: 36px; object-fit: cover; border-radius: 8px; background: #000; }
.ytm-title { flex: 1; min-width: 0; font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ytm-empty { padding: 8px 2px; font-size: .82rem; opacity: .7; }

/* ============ Responsif ============ */
@media (max-width: 480px), (max-height: 640px) {
    :root { --cw: 124px; --ch: 212px; }
    .card-art i { font-size: 1.7rem; }
    .card-title { font-size: .68rem; }
    .card-desc { font-size: .6rem; }
    .brand h1 { font-size: 1.15rem; }
    .action-btn { width: 40px; height: 40px; }
}
@media (max-height: 520px) {
    :root { --cw: 112px; --ch: 168px; }
    .card-art i { font-size: 1.4rem; }
    .card-title { font-size: .6rem; }
    .card-desc { display: none; }
    .hint, .brand p { display: none; }
}


/* ============ Halaman panjang: halaman 1 (arc) dan halaman 2 (daftar kartu) ============ */
.page1 { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; --chrome: 1; }
@supports (overflow: clip) { .page1 { overflow: clip; } }
.page1 .moon { z-index: 1; }
/* elemen halaman 1 ikut tergulir bersama halaman (bukan menempel di layar) */
.page1 .aura, .page1 .pulse, .page1 .witch, .page1 .witch-zone, .page1 .brand, .page1 .hint,
.page1 .pager, .page1 .witch-dialog { position: absolute; }
.page1 .brand, .page1 .hint, .page1 .pager, .page1 .scroll-cue { opacity: var(--chrome); }
.page1 .hint.hide { opacity: 0; }
.page1.away .brand, .page1.away .hint, .page1.away .pager, .page1.away .scroll-cue { visibility: hidden; pointer-events: none; }
.scroll-cue { position: absolute; z-index: 30; right: calc(14px + var(--safe-r)); bottom: calc(18px + var(--safe-b)); }
.scroll-cue i { animation: cueBob 2.2s ease-in-out infinite; }
@keyframes cueBob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }

.page2 {
    position: relative; min-height: 100vh; min-height: 100dvh;
    --gg: clamp(16px, 2.2vw, 30px);
    padding: calc(clamp(56px, 11vh, 110px) + var(--safe-t)) calc(clamp(16px, 4.5vw, 64px) + var(--safe-r)) 0px calc(clamp(16px, 4.5vw, 64px) + var(--safe-l));
    display: flex; flex-direction: column; gap: clamp(24px, 5vh, 48px);
}
.p2-head { position: relative; z-index: 20; opacity: 0; will-change: opacity, transform; }
.p2-head h2 { font-size: clamp(1.15rem, 2.6vw, 1.7rem); font-weight: 900; letter-spacing: .3em; color: var(--card-title); }
.p2-head p { font-family: var(--font-ui); font-size: .82rem; font-weight: 600; color: var(--muted); margin-top: 6px; }
.p2-head .rule { width: 72px; height: 2px; margin-top: 14px; border-radius: 2px; background: linear-gradient(90deg, var(--card-on-border), transparent); }
.p2-top { position: absolute; z-index: 21; top: calc(18px + var(--safe-t)); right: calc(clamp(16px, 4.5vw, 64px) + var(--safe-r)); }
.p2-body { position: relative; flex: none; }
/* ruang gulir tambahan: kartu tetap tertahan di layar sementara halaman 3 naik dari bawah */
.p2-body::after { content: ''; display: block; height: 10vh; height: 10dvh; }
/* Halaman 3 (Tanya Penyihir) dinonaktifkan: butuh PHP yang tidak tersedia di Netlify */
.page3 { display: none !important; }
.p2-grid {
    position: sticky; top: 14vh; z-index: 20; min-width: 0;
    display: grid; grid-template-columns: repeat(auto-fill, var(--cw)); gap: var(--gg);
    justify-content: start; align-content: start;
}
.grid-card {
    position: relative; z-index: 20; width: var(--cw); height: var(--ch);
    visibility: hidden; opacity: 0; pointer-events: none;
    will-change: transform, opacity; backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.grid-card.live { pointer-events: auto; }
.grid-card .card-hit { cursor: pointer; }
.grid-card .card-face { --rx: 0deg; --ry: 0deg; }
.grid-card.live:hover .card-face, .grid-card:focus-within .card-face {
    transform: perspective(800px) translateY(-6px) rotateX(var(--rx)) rotateY(var(--ry));
    background: var(--card-on-bg); border-color: var(--card-on-border); box-shadow: var(--card-on-shadow);
}
@media (max-width: 720px) { .p2-grid { justify-content: center; } }
/* kartu miring 3D mengikuti kursor + kilau cahaya */
.grid-card.tilting .card-face { transition: transform .09s linear, background .4s, border-color .4s, box-shadow .4s; }
.grid-card .card-face::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .6), rgba(250, 204, 21, .2) 30%, transparent 58%);
    mix-blend-mode: soft-light;
}
.grid-card.tilting .card-face::after { opacity: 1; }
.page-nav { position: fixed; z-index: 28; left: calc(12px + var(--safe-l)); top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 6px; }
.page-nav button { position: relative; width: 16px; height: 18px; display: grid; place-items: center; border-radius: 9px; transition: height .35s cubic-bezier(.16, 1, .3, 1); }
.page-nav button::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box;
    border: 1.5px solid var(--card-on-border); background: transparent; opacity: .7;
    transition: height .35s cubic-bezier(.16, 1, .3, 1), background .3s, opacity .3s, box-shadow .3s;
}
.page-nav button[aria-current="true"] { height: 34px; }
.page-nav button[aria-current="true"]::before { height: 24px; border-radius: 4px; background: var(--card-on-border); opacity: 1; box-shadow: 0 0 10px var(--card-on-border); }
.page-nav button:hover::before, .page-nav button:focus-visible::before { opacity: 1; background: var(--card-on-border); }
.page-nav span {
    position: absolute; left: 24px; top: 50%; translate: -4px -50%; padding: 4px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none;
    font: 700 .68rem var(--font-ui); letter-spacing: .08em; color: var(--card-title);
    background: var(--card-on-bg); border: 1px solid var(--card-border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; transition: opacity .2s, translate .25s;
}
.page-nav button:hover span, .page-nav button:focus-visible span { opacity: 1; translate: 0 -50%; }
@media (max-width: 720px) { .page-nav { left: calc(3px + var(--safe-l)); } .page-nav button { width: 12px; } .page-nav span { display: none; } }
/* debu bintang */
.dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

/* ============ Halaman 3: lingkaran sihir, arc, dan kotak tanya ============ */
html[data-theme="light"] .page3 { --mc: #7c3aed; --mc2: rgba(234, 179, 8, .75); --ray: rgba(167, 139, 250, .5); --ray2: rgba(250, 204, 21, .45); --flash: rgba(255, 233, 160, .9); }
html[data-theme="dark"] .page3 { --mc: #facc15; --mc2: rgba(250, 204, 21, .7); --ray: rgba(250, 204, 21, .34); --ray2: rgba(192, 132, 252, .3); --flash: rgba(255, 240, 180, .85); }
.page3 { position: relative; height: 190vh; height: 190dvh; margin-top: -100vh; --m: 0; --wv: 0; --fl: 0; }
/* tiga lapisan menempel di layar (sticky) selama gulir tambahan; lapisan penyihir memegang mode campur sendiri */
.p3-layer { position: sticky; top: 0; height: 100vh; height: 100dvh; margin-bottom: -100vh; margin-bottom: -100dvh; overflow: hidden; pointer-events: none; }
.p3-back { z-index: 2; }
.p3-wl { z-index: 3; }
.p3-front { z-index: 36; }
.p3-front > .p3-up, .p3-front > .ask-bar { pointer-events: auto; }
.p3-head { position: absolute; z-index: 20; left: 0; right: 0; top: calc(clamp(20px, 3.5vh, 44px) + var(--safe-t)); text-align: center; opacity: var(--wv); pointer-events: none; z-index: 40; }
.p3-head h2 { font-size: clamp(1.1rem, 2.6vw, 1.6rem); font-weight: 900; letter-spacing: .3em; padding-left: .3em; color: var(--card-title); }
.p3-head p { font-family: var(--font-ui); font-size: .8rem; font-weight: 600; color: var(--muted); margin-top: 6px; padding: 0 16px; }
.p3-up { position: absolute; z-index: 21; top: calc(18px + var(--safe-t)); right: calc(clamp(16px, 4.5vw, 64px) + var(--safe-r)); opacity: var(--wv); }
.page3.idle .p3-head, .page3.idle .p3-up, .page3.idle .ask-bar { visibility: hidden; pointer-events: none; }
/* sinar yang memancar */
.p3-rays {
    position: absolute; z-index: 1; left: 50%; top: 50%; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; pointer-events: none;
    opacity: calc(var(--m) * (.9 - .7 * var(--wv))); scale: calc(.35 + .65 * var(--m));
    background: repeating-conic-gradient(from 0deg, var(--ray) 0deg 1.4deg, transparent 1.4deg 10deg);
    -webkit-mask-image: radial-gradient(circle closest-side, #000 3%, transparent 32%); mask-image: radial-gradient(circle closest-side, #000 3%, transparent 32%);
    animation: spinCW 150s linear infinite;
}
.p3-rays::after { content: ''; position: absolute; inset: 0; background: repeating-conic-gradient(from 4deg, var(--ray2) 0deg .8deg, transparent .8deg 15deg); animation: spinCCW 100s linear infinite; }
/* lingkaran formasi sihir: tergambar pelan mengikuti gulir */
.p3-circle {
    position: absolute; z-index: 2; left: 50%; top: 55%; width: min(86vmin, 860px); translate: -50% -50%; pointer-events: none;
    opacity: calc(var(--m) * 3 * (1 - var(--wv))); filter: drop-shadow(0 0 calc(5px + var(--lit, 0) * 10px) var(--mc2));   /* garis sihir memudar saat arc muncul; makin terang tiap kartu mendarat */
}
.p3-circle .ln { fill: none; stroke: var(--mc); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.p3-circle .dr { stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--m)); }
.p3-circle .fd { opacity: calc(var(--m) * var(--m)); }
.p3-circle .sp { transform-box: fill-box; transform-origin: 50% 50%; }
.p3-circle .sp1 { animation: spinCW 90s linear infinite; }
.p3-circle .sp2 { animation: spinCCW 70s linear infinite; }
.p3-circle .sp3 { animation: spinCW 55s linear infinite; }
.p3-circle .dot { fill: var(--mc); stroke: none; }
/* simpul rune: satu per kartu, menyala saat kartu mendarat */
.p3-circle .rune .rn-dot { fill: var(--mc); stroke: none; opacity: .2; transform-box: fill-box; transform-origin: 50% 50%; transition: opacity .35s, transform .5s cubic-bezier(.16, 1, .3, 1); }
.p3-circle .rune .rn-ring { fill: none; stroke: var(--mc); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
.p3-circle .rune.lit .rn-dot { opacity: 1; transform: scale(1.8); filter: drop-shadow(0 0 3px var(--mc2)); }
.p3-circle .rune.lit .rn-ring { animation: runePing .9s ease-out; }
@keyframes runePing { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(5.5); } }
/* kilatan saat arc muncul */
.p3-flash {
    position: absolute; z-index: 2; left: 50%; top: 52%; width: min(80vmin, 700px); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, var(--flash) 0%, var(--ray2) 32%, transparent 68%);
    opacity: var(--fl); scale: calc(.55 + .75 * var(--fl));
}
.p3-witch { --h3: min(110vh, calc(125vw * 16 / 9)); position: absolute; z-index: 3; left: 50%; bottom: -7vh; translate: -50% 0; height: var(--h3); width: calc(var(--h3) * 9 / 16); pointer-events: none; }
@supports (height: 100dvh) { .p3-witch { --h3: min(110dvh, calc(125vw * 16 / 9)); bottom: -7dvh; } }
.p3-fig { width: 100%; height: 100%; transform-origin: 50% 100%; animation: welcomeSway 8s ease-in-out infinite; }
@keyframes welcomeSway { 0%, 100% { transform: rotate(-.5deg) translateY(0); } 50% { transform: rotate(.5deg) translateY(-6px); } }
.p3-fig video { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s ease; }
.p3-fig video.ready { opacity: var(--wv); }
html[data-theme="light"] .p3-wl { mix-blend-mode: multiply; }
html[data-theme="light"] .p3-fig video { clip-path: inset(8.2% 0); filter: brightness(1.04) contrast(1.05); }
html[data-theme="dark"] .p3-wl { mix-blend-mode: screen; }
html[data-theme="dark"] .p3-fig video {
    -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
}
/* kotak tanya kini berada di halaman 3 */
.page3 .ask-bar { position: absolute; z-index: 31; bottom: calc(40px + var(--safe-b)); opacity: var(--wv); }
/* balon jawaban penyihir */
html[data-theme="light"] .p3-dialog { --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, .78), rgba(224, 231, 255, .5)); --glass-line: rgba(124, 58, 237, .25); --glass-edge: rgba(255, 255, 255, .85); --glass-shadow: 0 12px 36px rgba(79, 70, 229, .22); }
html[data-theme="dark"] .p3-dialog { --glass-bg: linear-gradient(145deg, rgba(60, 34, 110, .55), rgba(14, 8, 30, .5)); --glass-line: rgba(250, 204, 21, .3); --glass-edge: rgba(255, 255, 255, .16); --glass-shadow: 0 12px 40px rgba(0, 0, 0, .55); }
/* Balon di dekat penyihir seperti di halaman 1: sebelah kiri kepala, ekor menunjuk ke penyihir */
.p3-dialog {
    --h3: min(110vh, calc(125vw * 16 / 9)); --dw: min(300px, 64vw);
    position: absolute; z-index: 36; width: var(--dw);
    left: max(calc(12px + var(--safe-l)), calc(50% - var(--h3) * 9 / 16 * .2 - var(--dw)));
    top: clamp(calc(168px + var(--safe-t)), calc(107vh - var(--h3) * .78), 50%);
    padding: 10px 14px 11px; border-radius: 16px 16px 5px 16px;
    background: var(--glass-bg); border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
    opacity: 0; transform: translateY(10px) scale(.92); transform-origin: 100% 70%; pointer-events: none; cursor: pointer;
    transition: opacity .45s ease, transform .5s cubic-bezier(.16, 1, .3, 1);
}
@supports (height: 100dvh) { .p3-dialog { --h3: min(110dvh, calc(125vw * 16 / 9)); top: clamp(calc(168px + var(--safe-t)), calc(107dvh - var(--h3) * .78), 50%); } }
.p3-dialog.show { opacity: 1; transform: none; pointer-events: auto; }
.p3-dialog::after {
    content: ''; position: absolute; right: -6px; top: 26px; width: 10px; height: 10px; margin-top: -5px;
    background: var(--glass-bg); border-right: 1px solid var(--glass-line); border-top: 1px solid var(--glass-line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transform: rotate(45deg);
}
/* bentuk tulisan jawaban: dipilih lewat tombol "Aa" di kotak tanya */
html { --wd-font: 'Lora', Georgia, 'Times New Roman', serif; --wd-size: 1.02rem; --wd-weight: 600; --wd-lh: 1.5; --wd-ls: 0; }
html[data-wfont="hand"] { --wd-font: 'Caveat', 'Satisfy', 'Segoe Script', cursive; --wd-size: 1.32rem; --wd-weight: 700; --wd-lh: 1.22; --wd-ls: 0; }
html[data-wfont="sans"] { --wd-font: var(--font-ui); --wd-size: .98rem; --wd-weight: 600; --wd-lh: 1.5; --wd-ls: 0; }
html[data-wfont="clear"] { --wd-font: 'Atkinson Hyperlegible', Verdana, Tahoma, sans-serif; --wd-size: 1.06rem; --wd-weight: 700; --wd-lh: 1.55; --wd-ls: .015em; }
.p3-dialog .wd-text {
    font-family: var(--wd-font); font-size: var(--wd-size); font-weight: var(--wd-weight); line-height: var(--wd-lh); letter-spacing: var(--wd-ls);
    max-height: min(240px, 34vh); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-right: 2px;
    user-select: text; -webkit-user-select: text; color: var(--card-title); text-shadow: none;
}
@supports (height: 100dvh) { .p3-dialog .wd-text { max-height: min(240px, 34dvh); } }
html[data-theme="light"] .p3-dialog.err .wd-text { color: #be123c; }
html[data-theme="dark"] .p3-dialog.err .wd-text { color: #fda4af; }
/* latar balon lebih pekat agar tulisan jelas di atas garis lingkaran sihir */
html[data-theme="light"] .p3-dialog { --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, .94), rgba(238, 242, 255, .88)); }
html[data-theme="dark"] .p3-dialog { --glass-bg: linear-gradient(145deg, rgba(48, 26, 92, .9), rgba(16, 9, 34, .88)); }
/* pemilih bentuk tulisan */
.font-pop {
    position: absolute; left: 0; bottom: calc(100% + 10px); width: min(250px, calc(100vw - 24px)); padding: 6px; border-radius: 16px;
    display: flex; flex-direction: column; gap: 3px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--panel-line); box-shadow: var(--btn-shadow);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.font-pop[hidden] { display: none; }
.font-opt { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 11px; text-align: left; border: 1.5px solid transparent; color: var(--ink); transition: background .2s, border-color .2s; }
.font-opt:hover { background: var(--item-bg); }
.font-opt[aria-checked="true"] { border-color: var(--focus); background: var(--item-bg); }
.font-opt .fx { width: 38px; flex: none; text-align: center; font-size: 1.35rem; line-height: 1; }
.font-opt .fl { font: 700 .76rem var(--font-ui); }
.font-opt .fl small { display: block; font-weight: 500; font-size: .66rem; color: var(--muted); margin-top: 1px; }
.font-opt[data-f="hand"] .fx { font-family: 'Caveat', 'Segoe Script', cursive; font-weight: 700; font-size: 1.6rem; }
.font-opt[data-f="serif"] .fx { font-family: 'Lora', Georgia, serif; font-weight: 600; }
.font-opt[data-f="sans"] .fx { font-family: var(--font-ui); font-weight: 700; }
.font-opt[data-f="clear"] .fx { font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; font-weight: 700; }

/* ============ Kabut asap tertiup angin (digambar di kanvas oleh JS) ============ */
.fog-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.fog-canvas.front { position: fixed; z-index: 6; opacity: .85; }         /* lapisan tipis yang lewat di depan penyihir */
html[data-theme="dark"] .fog-canvas { mix-blend-mode: screen; }

/* ============ Obrolan AI ============ */
.chat-panel {
    position: fixed; z-index: 860; top: 0; right: 0; height: 100vh; height: 100dvh;
    width: min(420px, 100vw);
    padding: calc(18px + var(--safe-t)) calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) 16px;
    background: var(--panel); color: var(--ink);
    border-left: 1px solid var(--panel-line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    font-family: var(--font-ui);
    display: flex; flex-direction: column;
    transform: translateX(105%); visibility: hidden;
    transition: transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s .35s;
    user-select: text; -webkit-user-select: text;
}
.chat-panel.show { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s; }
.chat-head-btns { display: flex; gap: 8px; }
.chat-log {
    flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 10px;
}
.chat-msg {
    max-width: 88%; padding: 10px 13px; border-radius: 16px;
    font-size: .88rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
    animation: chatIn .25s cubic-bezier(.16, 1, .3, 1) both;
}
@keyframes chatIn { from { opacity: 0; transform: translateY(8px); } }
.chat-msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 5px; }
.chat-msg.model { align-self: flex-start; background: var(--item-bg); color: var(--ink); border: 1px solid var(--panel-line); border-bottom-left-radius: 5px; }
.chat-msg.error { align-self: flex-start; background: rgba(225, 29, 72, .12); color: var(--ink); border: 1px solid rgba(225, 29, 72, .45); border-bottom-left-radius: 5px; }
.chat-msg strong { font-weight: 800; }
.chat-msg code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82em; padding: 1px 5px; border-radius: 6px; background: rgba(127, 127, 127, .2); }
.chat-msg pre { margin: 6px 0; padding: 10px; border-radius: 10px; overflow-x: auto; white-space: pre; background: rgba(0, 0, 0, .35); color: #f8fafc; touch-action: pan-x pan-y; }
.chat-msg pre code { background: none; padding: 0; font-size: .8rem; }
.chat-msg ul { margin: 4px 0; padding-left: 1.2em; white-space: normal; }
.chat-typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
.chat-typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--item-ink); opacity: .35; animation: chatDot 1s ease-in-out infinite; }
.chat-typing i:nth-child(2) { animation-delay: .15s; }
.chat-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes chatDot { 40% { opacity: 1; transform: translateY(-3px); } }
.chat-compose { display: flex; align-items: flex-end; gap: 8px; padding-top: 10px; border-top: 1px solid var(--panel-line); }
.chat-compose textarea {
    flex: 1; min-width: 0; resize: none; max-height: 140px; padding: 11px 14px; border-radius: 18px;
    font: 500 16px/1.4 var(--font-ui); color: var(--ink);
    background: var(--field-bg); border: 1px solid var(--field-border); outline: none;
    touch-action: pan-y;
}
.chat-compose textarea:focus { border-color: var(--focus); }
.chat-compose .action-btn { flex: none; }
.chat-compose .action-btn:disabled { opacity: .45; pointer-events: none; }
.chat-note { font-size: .68rem; color: var(--muted); text-align: center; margin-top: 8px; }
@media (max-width: 520px) { .chat-panel { width: 100vw; border-left: 0; } }

/* ============ Kotak tanya di bawah kartu + ucapan AI penyihir ============ */
.ask-bar {
    position: fixed; z-index: 31; left: 50%; translate: -50% 0;
    bottom: calc(66px + var(--safe-b));
    width: min(420px, calc(100vw - 24px));
    display: flex; align-items: center; gap: 6px; padding: 4px 5px; border-radius: 99px;
    background: var(--btn-bg); border: 1px solid var(--btn-border); box-shadow: var(--btn-shadow);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: border-color .25s, background .4s;
}
.ask-bar:focus-within { border-color: var(--focus); }
/* keyboard layar HP terbuka: kotak tanya naik ke atas keyboard */
html.kb-open .ask-bar { bottom: calc(var(--kb, 0px) + 8px); }
.ask-input {
    flex: 1; min-width: 0; height: 36px; padding: 0 6px; border: 0; outline: 0; background: transparent;
    font: 600 16px var(--font-ui); color: var(--ink);
    user-select: text; -webkit-user-select: text; touch-action: manipulation;
}
.ask-input::placeholder { color: var(--muted); }
.ask-bar .action-btn { width: 36px; height: 36px; font-size: .85rem; flex: none; }
.ask-bar .action-btn:disabled { opacity: .45; pointer-events: none; }

/* Dialog penyihir saat menjawab dengan AI: lebih lebar, bisa digulir, bertahan sampai disentuh */
.witch-dialog.ai { --dw: min(290px, 62vw); pointer-events: auto; cursor: pointer; z-index: 36; }
.witch-dialog.ai .wd-text {
    font-family: 'Caveat', 'Satisfy', 'Segoe Script', cursive; font-size: 1.22rem; font-weight: 700; line-height: 1.22;
    max-height: var(--ai-max, 180px);
    overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-right: 2px;
    user-select: text; -webkit-user-select: text;
}
html[data-theme="light"] .witch-dialog.ai.err .wd-text { color: #be123c; }
html[data-theme="dark"] .witch-dialog.ai.err .wd-text { color: #fda4af; }

/* ============ Kurangi gerak ============ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>

/* ============ Util ============ */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeIcon = (s) => (typeof s === 'string' && /^[a-z0-9\- ]{2,60}$/i.test(s)) ? s : 'fas fa-link';
function normalizeUrl(raw) {
    let v = String(raw || '').trim();
    if (!v) return null;
    if (!/^[a-z][a-z0-9+.\-]*:/i.test(v)) v = 'https://' + v;
    try { const u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : null; } catch { return null; }

const store = {
    get(k, s = localStorage) { try { return s.getItem(k); } catch { return null; } },

const scene = $('scene'), carousel = $('carousel'), dotsEl = $('dots'), hint = $('hint');

function lockScroll() { document.documentElement.classList.toggle('no-scroll', modalOpen || menuOpen || chatOpen); }

/* ============ Toast ============ */
function showToast(message, type = 'info') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    const i = document.createElement('i');
    i.className = 'fas ' + ({ success: 'fa-circle-check', error: 'fa-triangle-exclamation' }[type] || 'fa-circle-info');
    i.setAttribute('aria-hidden', 'true');
    const s = document.createElement('span');
    s.textContent = message;
    t.append(i, s);
    toastBox.appendChild(t);
    while (toastBox.children.length > 3) toastBox.firstElementChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3200);
}

/* ============ Modal ============ */
function showModal({ title, bodyHtml, buttons, onOpen }) {
    lastFocus = document.activeElement;
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    modalFooter.textContent = '';
    buttons.forEach((b) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'btn ' + (b.kind || 'btn-ghost');
        el.textContent = b.text;
        el.addEventListener('click', async () => {
            const keepOpen = b.onClick ? await b.onClick() : undefined;
            if (keepOpen !== false) closeModal();

        modalFooter.appendChild(el);
    });
    modalOpen = true;
    lockScroll();
    modalOverlay.classList.add('show');

    setTimeout(() => first && first.focus({ preventScroll: true }), 60);

    lockScroll();

/* ----- Judul otomatis: dicari sekali oleh admin, lalu disimpan permanen ----- */
async function ytFetchTitle(vid) {
    const u = encodeURIComponent('https://www.youtube.com/watch?v=' + vid);
    for (const api of ['https://noembed.com/embed?url=', 'https://www.youtube.com/oembed?format=json&url=']) {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 4000);
        try {
            const r = await fetch(api + u, { signal: ctl.signal });
            if (!r.ok) continue;
            const j = await r.json();
            if (j && typeof j.title === 'string' && j.title.trim()) return j.title.trim().slice(0, 80);
        } catch {} finally { clearTimeout(to); }
    }
    return '';
}
async function ytFillTitles() {
    const miss = playlist.filter((t) => !t.title);
    let n = 0;
    await Promise.all(miss.map(async (t) => {
        const title = await ytFetchTitle(t.vid);
        if (title && !t.title) { t.title = title; n++; }
    }));
    if (n) { ytRender(); saveState(); }
    return n;
}

function ytVolIcon(v) { return 'fas ' + (v === 0 ? 'fa-volume-xmark' : v < 40 ? 'fa-volume-low' : 'fa-volume-high'); }
function openMusicManager() {

        onOpen: () => {

                ytVolume = +vr.value;
                ytApplyVolume();
                $('mVolNum').textContent = String(ytVolume);
                $('mVolIcon').className = ytVolIcon(ytVolume);
            });

                li.querySelector('[data-a="edit"]').addEventListener('click', () => ytTrackModal(i));
                li.querySelector('[data-a="del"]').addEventListener('click', () => ytDeleteModal(i));
            });

        buttons: [
            { text: 'Tambah lagu', kind: 'btn-primary', onClick: () => {
                if (playlist.length >= YT_MAX) { showToast('Maksimal ' + YT_MAX + ' lagu', 'error'); return false; }
                ytTrackModal(-1); return false;
            } },
            { text: 'Selesai' }
        ]
    });
}
function ytTrackModal(i) {
    const isNew = i < 0, t = isNew ? null : playlist[i];
    showModal({
        title: isNew ? 'Tambah lagu' : 'Ganti lagu',
        bodyHtml: field('fYtUrl', 'Tautan YouTube', 'text', 'inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=..."')
            + field('fYtTitle', 'Judul (boleh dikosongkan)', 'text', 'maxlength="80" autocomplete="off"'),
        onOpen: () => { if (t) { $('fYtUrl').value = 'https://youtu.be/' + t.vid; $('fYtTitle').value = t.title; } },
        buttons: [
            { text: 'Batal', onClick: () => { openMusicManager(); return false; } },
            { text: isNew ? 'Tambah' : 'Simpan', kind: 'btn-primary', onClick: () => {
                const vid = ytId($('fYtUrl').value);
                if (!vid) { showToast('Tautan YouTube tidak valid', 'error'); return false; }
                const title = $('fYtTitle').value.trim();
                if (isNew) {
                    playlist.push({ id: 'yt_' + Date.now(), vid, title });
                    if (playlist.length === 1) ytLoad(0, false);
                } else {
                    const changed = t.vid !== vid;
                    t.vid = vid; t.title = title;
                    if (changed && i === ytIndex) ytLoad(ytIndex, ytPlaying);
                }
                ytSync(); saveState(); openMusicManager();
                return false;
            } }
        ]
    });
}
function ytDeleteModal(i) {
    const t = playlist[i];
    if (!t) return;
    showModal({
        title: 'Hapus lagu',
        bodyHtml: `<p>Hapus <strong>"${esc(ytName(t, i))}"</strong> dari daftar lagu?</p>`,
        buttons: [
            { text: 'Batal', onClick: () => { openMusicManager(); return false; } },
            { text: 'Hapus', kind: 'btn-danger', onClick: () => {
                const wasCurrent = i === ytIndex, wasPlaying = ytPlaying;
                playlist.splice(i, 1);
                if (i < ytIndex) ytIndex--;
                if (!playlist.length) {
                    ytIndex = 0; ytPlaying = false;
                    if (ytReady) { try { ytPlayer.stopVideo(); } catch {} }
                } else if (wasCurrent) {
                    if (ytIndex >= playlist.length) ytIndex = 0;
                    ytLoad(ytIndex, wasPlaying);
                }
                ytSync(); saveState(); openMusicManager();
                return false;
            } }
        ]
    });
}

/* Penyaji markdown ringan: semua teks di-escape dulu, jadi aman dari HTML liar */
function mdToHtml(src) {
    const blocks = [];
    let t = esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c.replace(/\n$/, '')); return '\uE000' + (blocks.length - 1) + '\uE001'; });
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>')
         .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
         .replace(/^[ \t]*[-*•] +(.+)$/gm, '<li>$1</li>')
         .replace(/(?:<li>.*<\/li>\n?)+/g, (m) => '<ul>' + m.replace(/\n/g, '') + '</ul>')
         .replace(/<\/ul>\n/g, '</ul>');
    return t.replace(/\uE000(\d+)\uE001/g, (_, i) => '<pre><code>' + blocks[+i] + '</code></pre>');
}
function addBubble(kind, text) {
    const d = document.createElement('div');
    d.className = 'chat-msg ' + kind;
    if (kind === 'model') d.innerHTML = mdToHtml(text); else d.textContent = text;
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
    return d;
}
function addTyping() {
    const d = document.createElement('div');
    d.className = 'chat-msg model chat-typing';
    d.setAttribute('aria-label', 'ARC sedang menulis');
    d.innerHTML = '<i></i><i></i><i></i>';
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
    return d;
}

/* Inti pemanggilan AI: dipakai kotak tanya di bawah kartu (brief) dan panel riwayat (jawaban penuh) */
async function askAI(text, brief) {
    chatHist.push({ r: 'user', t: text });
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 50000);
    try {
        const res = await fetch('tanya.php', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
            body: JSON.stringify({ brief: !!brief, messages: chatHist.slice(-16).map((m) => ({ role: m.r, text: m.t })) })
        });
        const raw = await res.text();
        let data = null;
        try { data = JSON.parse(raw); } catch {}
        if (!data) {
            const peek = raw.replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
            throw new Error('Server membalas bukan JSON (HTTP ' + res.status + '): ' + (peek || 'balasan kosong'));
        }
        if (!res.ok || data.status !== 'success' || !data.reply) throw new Error(data.message || 'Sang penyihir tidak menjawab.');
        chatHist.push({ r: 'model', t: data.reply });
        saveChat();
        return data.reply;
    } catch (err) {
        chatHist.pop();                                  // pesan gagal tidak ikut riwayat
        throw new Error(err.name === 'AbortError' ? 'Waktu habis. Coba kirim lagi.' : (err.message || 'Gagal terhubung ke server.'));
    } finally {
        clearTimeout(timer);
    }
}
async function sendChat() {                              // panel riwayat
    if (chatBusy) return;
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = ''; autosize();
    addBubble('user', text);
    chatBusy = true; chatSend.disabled = true;
    const typing = addTyping();
    try {
        const reply = await askAI(text, false);
        typing.remove();
        addBubble('model', reply);
    } catch (err) {
        typing.remove();
        chatInput.value = text; autosize();              // kembalikan ke kotak tulis agar bisa dikirim ulang
        addBubble('error', err.message);
    } finally {
        chatBusy = false; chatSend.disabled = false;
        chatInput.focus({ preventScroll: true });
    }
}

const askInput = $('askInput'), askSend = $('askSend');
const adlg = $('p3Dialog'), aGhost = $('p3Ghost'), aLive = $('p3Live'), wdText = adlg.querySelector('.wd-text');
let aiTimers = [], aiTyper = 0;
function resetWitchSpeech() {
    aiTimers.forEach(clearTimeout); aiTimers = [];
    clearInterval(aiTyper);
}
function closeWitchSpeech() {
    if (!adlg.classList.contains('show')) return;
    resetWitchSpeech();
    adlg.classList.remove('show');
    adlg.setAttribute('aria-hidden', 'true'); adlg.removeAttribute('role');
    aLive.classList.remove('typing');
}
/* Jawaban penyihir tampil di balon halaman 3 */
function witchSpeak(text, { wait = false, error = false } = {}) {
    resetWitchSpeech();
    adlg.classList.toggle('err', error);
    adlg.setAttribute('aria-hidden', 'false'); adlg.setAttribute('role', 'status');
    aGhost.textContent = text;
    aLive.textContent = '';
    wdText.scrollTop = 0;
    adlg.classList.add('show');
    const finish = () => {
        aLive.classList.remove('typing');
        aiTimers.push(setTimeout(closeWitchSpeech, Math.max(15000, text.length * 110)));
    };
    if (wait) { aLive.textContent = text; aLive.classList.add('typing'); return; }
    if (reduced) { aLive.textContent = text; finish(); return; }
    aLive.classList.add('typing');
    const step = Math.max(1, Math.ceil(text.length / 150));
    let n = 0;
    aiTyper = setInterval(() => {
        n = Math.min(text.length, n + step);
        aLive.textContent = text.slice(0, n);
        wdText.scrollTop = (wdText.scrollHeight - wdText.clientHeight) * (n / text.length);   // gulir mengikuti ketikan
        if (n >= text.length) { clearInterval(aiTyper); finish(); }
    }, 30);
}
adlg.addEventListener('click', closeWitchSpeech);        // sentuh balon untuk menutup

/* ============ Kabut asap tertiup angin ============ */
(function () {
    const root = document.documentElement;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const Q = .5;                                    // digambar setengah resolusi: kabut memang lembut, jadi lebih hemat tenaga
    const COLORS = [[139, 92, 246], [167, 139, 250], [192, 132, 252], [250, 204, 21]];   // ungu, lavender, ungu muda, emas
    const rnd = (a, b) => a + Math.random() * (b - a);

        const c = document.createElement('canvas'); c.width = c.height = 128;
        const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.35, `rgba(${r},${g},${b},.55)`);

        x.fillStyle = gr; x.fillRect(0, 0, 128, 128);

    });
    function makeLayer(canvas, o) {
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, puffs = [];
        function spawn(p, anywhere) {
            const gold = Math.random() < .16, base = Math.max(Math.min(W, H), Math.max(W, H) * .55);
            p.c = gold ? 3 : (Math.random() * 3 | 0);
            p.a = (gold ? .14 : .24) * rnd(.75, 1.35);
            p.r = rnd(.22, .45) * base * o.size;
            p.st = rnd(1.5, 2.6);                    // memanjang searah angin
            p.rot = rnd(-.25, .12); p.rs = rnd(-.04, .04);
            p.d = rnd(.55, 1.5);                     // kedalaman: yang dekat bergerak lebih cepat
            p.ph = rnd(0, 6.283); p.gf = rnd(.35, .9); p.wf = rnd(.12, .32); p.wa = rnd(8, 26);
            p.x = anywhere ? rnd(-p.r, W + p.r) : -p.r * p.st;
            p.y = rnd(-.05 * H, 1.05 * H);
        }
        function resize() {
            W = innerWidth; H = innerHeight;
            canvas.width = Math.max(1, W * Q | 0); canvas.height = Math.max(1, H * Q | 0);
            const n = Math.min(o.max, Math.max(o.min, Math.round(W * H / o.density)));
            puffs = Array.from({ length: n }, () => { const p = {}; spawn(p, true); return p; });
        }
        function draw(t, dt, gust) {
            const light = root.getAttribute('data-theme') !== 'dark';
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of puffs) {
                if (dt) {
                    p.x += 46 * gust * p.d * o.speed * dt;                       // hembusan angin
                    p.y += (-5 + Math.sin(t * p.wf + p.ph) * p.wa) * dt;          // melayang naik-turun
                    p.rot += p.rs * dt;
                    if (p.x - p.r * p.st > W) spawn(p, false);

                const glow = .5 + .5 * Math.sin(t * p.gf + p.ph);               // berpendar
                ctx.globalAlpha = Math.min(1, p.a * o.alpha * glow * (light ? 1.15 : 1) * (.85 + .25 * gust));

                ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.st, 1);
                ctx.drawImage(sprites[p.c], -p.r, -p.r, p.r * 2, p.r * 2);
            }
        }
        resize();
        return { resize, draw };
    }
    const back = document.getElementById('fogBack'), front = document.getElementById('fogFront');
    if (!back || !front) return;
    const layers = [
        makeLayer(back,  { density: 28000, min: 16, max: 56, size: 1.1, alpha: 1.5, speed: 1 }),
        makeLayer(front, { density: 90000, min: 6, max: 16, size: 1.4, alpha: .9, speed: 1.35 })
    ];
    const gustAt = (t) => .55 + .45 * Math.sin(t * .21) + .55 * Math.pow(Math.max(0, Math.sin(t * .47 + 1.3)), 2);
    const paint = () => layers.forEach((l) => l.draw(20, 0, 1));
    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layers.forEach((l) => l.resize()); if (still) paint(); }, 150); });
    if (still) {                                     // kurangi gerak: satu gambar diam saja
        paint();

    }
    const t0 = performance.now(); let last = t0;
    (function loop(now) {
        requestAnimationFrame(loop);
        if (document.hidden) { last = now; return; }
        const dt = Math.min(.05, (now - last) / 1000), t = (now - t0) / 1000; last = now;
        const gust = gustAt(t);
        layers.forEach((l) => l.draw(t, dt, gust));
    })(t0);
})();
